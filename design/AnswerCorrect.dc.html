<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
  </style>
</helmet>

<div class="phone">

  <!-- Top HUD: igual ao da rodada, nada se mexe -->
  <div style="display:flex; align-items:center; gap:12px; padding:34px 18px 8px 18px;">
    <button style="width:38px; height:38px; border-radius:11px; background:#1f2c33; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#7d929c" stroke-width="2.6" stroke-linecap="round"></path></svg>
    </button>
    <div style="flex:1; height:16px; border-radius:10px; background:#243139; overflow:hidden;">
      <div style="width:52%; height:100%; border-radius:10px; background:#ffc800;"></div>
    </div>
  </div>

  <div style="display:flex; gap:12px; padding:12px 18px 0 18px;">
    <div style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(75,192,240,.14); border-radius:14px; padding:10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="#4bc0f0" stroke-width="2.4"></circle><path d="M12 9v4l2.5 2" stroke="#4bc0f0" stroke-width="2.4" stroke-linecap="round"></path></svg>
      <span style="font-family:'Baloo 2',sans-serif; font-size:19px; font-weight:800; color:#8fd9f2;">0:31</span>
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(122,209,58,.22); border-radius:14px; padding:10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#7ad13a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-family:'Baloo 2',sans-serif; font-size:19px; font-weight:800; color:#9fe063;">9 acertos</span>
    </div>
  </div>

  <!-- O cartão fica onde estava; só ganha o contorno verde -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px;">
    <div style="width:100%; height:230px; border:2px solid #7ad13a; border-bottom-width:5px; border-radius:24px; background:#1f2c33; display:flex; align-items:center; justify-content:center; position:relative;">
      <span style="position:absolute; top:16px; left:18px; font-size:13px; font-weight:800; color:#ffc800;">C</span>
      <span class="display" style="font-size:46px; font-weight:800; color:#f1f7fb;">Courage</span>
    </div>
  </div>

  <!-- No lugar exato do campo de resposta: o veredito. O botão não sai do lugar. -->
  <div style="padding:0 18px 26px 18px;">

    <div style="display:flex; align-items:center; gap:12px; background:rgba(122,209,58,.14); border:2px solid #4a6b1f; border-radius:18px; padding:14px 16px; margin-bottom:14px;">
      <div style="width:34px; height:34px; border-radius:12px; background:#7ad13a; display:flex; align-items:center; justify-content:center; flex:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#16300a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <span class="display" style="font-size:22px; font-weight:800; color:#9fe063;">Certo!</span>
    </div>

    <button style="width:100%; height:56px; border:none; border-radius:16px; background:#7ad13a; box-shadow:0 4px 0 #4f8f22; color:#16300a; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; cursor:pointer;">Continuar</button>
  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
    .row { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:16px; background:#1c2a31; border:2px solid #2b3840; cursor:pointer; }
    .rname { flex:1; min-width:0; font-size:16px; font-weight:800; color:#f1f7fb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rcount { font-size:12px; font-weight:700; color:#7d929c; flex:none; }
    /* A árvore inteira à vista: cada nível recua um pouco mais */
    .n1 { margin-left:22px; }
    .n2 { margin-left:44px; }
  </style>
</helmet>

<div class="phone">

  <div style="flex:1; display:flex; flex-direction:column; padding:34px 18px 0 18px; gap:13px;">
    <div style="height:44px; border-radius:16px; background:#1c2a31; border:2px solid #37464f;"></div>
    <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px;">
      <div style="height:104px; border:2px solid #ffc800; border-bottom-width:4px; border-radius:18px; background:#1f2c33;"></div>
      <div style="height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33;"></div>
    </div>
  </div>

  <div style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(5,10,12,.66);"></div>

  <div style="position:absolute; left:0; right:0; bottom:0; background:#1f2c33; border-top:2px solid #37464f; border-top-left-radius:28px; border-top-right-radius:28px; padding:22px 18px 26px 18px;">

    <div style="width:44px; height:5px; border-radius:3px; background:#37464f; margin:0 auto 18px auto;"></div>

    <h2 class="display" style="margin:0 0 4px 0; font-size:22px; font-weight:800; color:#f1f7fb;">Mover para</h2>
    <p style="margin:0 0 18px 0; font-size:14px; font-weight:600; color:#7d929c;">3 itens selecionados</p>

    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">

      <div class="row">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex:none;"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" fill="rgba(255,159,69,.22)" stroke="#ff9f45" stroke-width="2" stroke-linejoin="round"></path></svg>
        <span class="rname">Adjetivos</span>
        <span class="rcount">6</span>
      </div>

      <div class="row">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex:none;"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" fill="rgba(192,132,252,.22)" stroke="#c084fc" stroke-width="2" stroke-linejoin="round"></path></svg>
        <span class="rname">Verbos</span>
        <span class="rcount">2 coleções</span>
      </div>

      <div class="row n1">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex:none;"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" fill="rgba(75,192,240,.22)" stroke="#4bc0f0" stroke-width="2" stroke-linejoin="round"></path></svg>
        <span class="rname">Irregulares</span>
        <span class="rcount">12</span>
      </div>

      <!-- Terceiro nível com nome comprido: o aperto aparece aqui -->
      <div class="row n2">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex:none;"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" fill="rgba(63,217,192,.22)" stroke="#3fd9c0" stroke-width="2" stroke-linejoin="round"></path></svg>
        <span class="rname">Regulares mais usados no dia a dia</span>
        <span class="rcount">8</span>
      </div>

      <div class="row n1">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex:none;"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" fill="rgba(255,126,182,.22)" stroke="#ff7eb6" stroke-width="2" stroke-linejoin="round"></path></svg>
        <span class="rname">Frasais</span>
        <span class="rcount">5</span>
      </div>

    </div>

    <button style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; height:52px; border:2px dashed rgba(255,200,0,.5); border-radius:16px; background:rgba(255,200,0,.08); cursor:pointer; margin-bottom:16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#ffc800" stroke-width="3" stroke-linecap="round"></path></svg>
      <span style="font-family:'Nunito',sans-serif; font-size:15px; font-weight:800; color:#ffc800;">Nova coleção</span>
    </button>

    <button style="width:100%; height:56px; border:none; border-radius:16px; background:transparent; color:#7d929c; font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; letter-spacing:.5px; cursor:pointer;">Cancelar</button>

  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

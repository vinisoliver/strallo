<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
  </style>
</helmet>

<div class="phone">

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 26px;">

    <!-- Celebration image: troféu no traço da marca -->
    <svg width="180" height="150" viewBox="0 0 180 150" fill="none">
      <!-- faíscas -->
      <path d="M152 78l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5z" fill="#ffe27a"></path><path d="M30 40l3.5 8.5 8.5 3.5-8.5 3.5L30 64l-3.5-8.5L18 52l8.5-3.5L30 40z" fill="#ffe27a"></path>
      <path d="M147 32l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5 2.5-6z" fill="#ffc800"></path>
      

      <!-- alças -->
      <path d="M58 44H43c0 17 6 26 17 28" stroke="#ffc800" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M112 44h15c0 17-6 26-17 28" stroke="#ffc800" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>

      <!-- taça -->
      <path d="M57 34h56v20c0 15.5-12.5 28-28 28S57 69.5 57 54V34z" fill="#ffc800"></path>
      <!-- estrela vazada -->
      <path d="M85 44l4.5 9.5 10.5 1.5-7.5 7.5 1.5 10.5-9-5-9 5 1.5-10.5-7.5-7.5 10.5-1.5L85 44z" fill="#2b2317"></path>

      <!-- haste e base -->
      <path d="M85 82v16" stroke="#ffc800" stroke-width="9" stroke-linecap="round"></path>
      <path d="M68 104h34c2.2 0 4 1.8 4 4v6H64v-6c0-2.2 1.8-4 4-4z" fill="#ffc800"></path>
      <rect x="58" y="118" width="54" height="11" rx="5.5" fill="#c99a00"></rect>
    </svg>

    <h1 class="display" style="margin:24px 0 6px 0; font-size:34px; font-weight:800; color:#ffc800;">Muito bem!</h1>
    <p style="margin:0; font-size:16px; font-weight:600; color:#7d929c;">Você mandou muito bem nessa rodada</p>

    <!-- Result boxes -->
    <div style="display:flex; gap:14px; width:100%; margin-top:30px;">
      <div style="flex:1; border:2px solid #1c556b; border-bottom-width:4px; border-radius:20px; overflow:hidden; background:#1f2c33;">
        <div style="background:#4bc0f0; padding:7px; text-align:center; font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#0c2731;">Tempo</div>
        <div style="padding:16px; text-align:center;">
          <div style="font-family:'Baloo 2',sans-serif; font-size:30px; font-weight:800; color:#8fd9f2;">1:00</div>
          <div style="font-size:13px; font-weight:700; color:#7d929c;">minuto</div>
        </div>
      </div>
      <div style="flex:1; border:2px solid #4a6b1f; border-bottom-width:4px; border-radius:20px; overflow:hidden; background:#1f2c33;">
        <div style="background:#7ad13a; padding:7px; text-align:center; font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#16300a;">Acertos</div>
        <div style="padding:16px; text-align:center;">
          <div style="font-family:'Baloo 2',sans-serif; font-size:30px; font-weight:800; color:#9fe063;">14 / 16</div>
          <div style="font-size:13px; font-weight:700; color:#ff6b6b;">2 erros</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Actions -->
  <div style="padding:12px 18px 30px 18px; display:flex; gap:12px;">
    <!-- Voltar para o início -->
    <button style="width:64px; height:58px; border-radius:16px; background:#1f2c33; border:2px solid #37464f; border-bottom-width:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3.5 11.5L12 4l8.5 7.5" stroke="#7d929c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M6 10.2V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8.8" stroke="#7d929c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <button style="flex:1; height:58px; border:none; border-radius:16px; background:#ffc800; box-shadow:0 4px 0 #c99a00; color:#2b2317; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 2.3 5.6" stroke="#2b2317" stroke-width="2.6" stroke-linecap="round"></path><path d="M4 20v-4h4" stroke="#2b2317" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      Recomeçar
    </button>
  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

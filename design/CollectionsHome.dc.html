<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
    .scroll { overflow-y:auto; overflow-x:hidden; }
    .tile { height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33; position:relative; display:flex; align-items:center; justify-content:center; padding:10px; }
    .letter { position:absolute; top:9px; left:11px; font-size:11px; font-weight:800; color:#ffc800; }
    .ref { font-weight:800; font-size:19px; color:#f1f7fb; }
    /* Coleção é o mesmo cartão: a cor aparece só no ícone do canto e na
       borda de baixo, sem fundo tingido. */
    .folder { height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:10px; }
    .fmark { position:absolute; top:9px; right:11px; line-height:0; }
    .fname { font-weight:800; font-size:17px; color:#f1f7fb; text-align:center; }
    .fcount { font-size:11px; font-weight:700; color:#7d929c; }
    .rail { font-size:13px; font-weight:700; color:#46565f; height:22px; display:flex; align-items:center; }
    .rail.on { font-weight:800; color:#c7d3d9; }
  </style>
</helmet>

<div class="phone">

  <!-- Header: sem mudança nenhuma -->
  <div style="padding:34px 18px 10px 18px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
      <svg width="100" height="34" viewBox="20 12 232 80" style="fill:none; stroke:#ffc800; stroke-linecap:round; stroke-linejoin:round;">
        <path d="M58 40 C49 33 33 35 33 46 C33 55 52 53 55 63 C57 72 42 75 30 68" stroke-width="10"></path>
        <path d="M70 24 C68 44 67 60 71 74 C73 80 79 79 83 75" stroke-width="10"></path>
        <path d="M54 43 C63 41 77 41 86 44" stroke-width="8.5"></path>
        <path d="M96 44 C95 55 95 64 97 74" stroke-width="10"></path>
        <path d="M96 49 C100 43 108 42 114 47" stroke-width="9"></path>
        <path d="M144 45 C143 55 143 64 146 74" stroke-width="10"></path>
        <path d="M144 50 C136 45 124 49 124 58 C124 67 135 71 145 66" stroke-width="10"></path>
        <path d="M156 24 C155 44 154 62 158 74 C160 80 166 79 170 75" stroke-width="10"></path>
        <path d="M180 24 C179 44 178 62 182 74 C184 80 190 79 194 75" stroke-width="10"></path>
        <path d="M213 44 C222 44 228 51 227 58 C226 66 219 71 211 70 C203 69 198 63 198 56 C199 49 205 44 213 44" stroke-width="10"></path>
      </svg>
      <div style="display:flex; align-items:center; gap:7px; background:rgba(255,200,0,.14); border-radius:14px; padding:6px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="8.5" y="3.5" width="11" height="15" rx="2.5" stroke="#ffc800" stroke-width="2"></rect><rect x="4.5" y="6.5" width="11" height="15" rx="2.5" fill="#131f24" stroke="#ffc800" stroke-width="2"></rect></svg>
        <span style="font-weight:800; color:#ffc800; font-size:15px;">24</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; background:#1c2a31; border:2px solid #37464f; border-radius:16px; padding:12px 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#7d929c" stroke-width="2.4"></circle><path d="M20 20l-3.2-3.2" stroke="#7d929c" stroke-width="2.4" stroke-linecap="round"></path></svg>
      <span style="color:#7d929c; font-weight:700; font-size:15px;">Buscar cartão</span>
    </div>
  </div>

  <!-- Coleções e cartões dividem a mesma grade e a mesma ordem alfabética -->
  <div style="flex:1; display:flex; overflow:hidden; position:relative;">

    <div class="scroll" style="flex:1; padding:6px 6px 16px 18px;">
      
    <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:13px;">

        <div style="height:104px; border:2px dashed rgba(255,200,0,.5); border-radius:18px; background:rgba(255,200,0,.08); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#ffc800" stroke-width="3" stroke-linecap="round"></path></svg>
          <span style="font-weight:800; color:#ffc800; font-size:13px; letter-spacing:.3px;">Adicionar</span>
        </div>

        <div class="tile"><span class="letter">A</span><span class="ref">Abandon</span></div>

        <div class="folder" style="border-bottom-color:#ff9f45;">
          <span class="fmark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" stroke="#ff9f45" stroke-width="2" stroke-linejoin="round"></path></svg></span>
          <span class="fname">Adjetivos</span>
          <span class="fcount" style="font-size: 10px">6 cartões</span>
        </div>

        <div class="tile"><span class="ref">Ability</span></div>
        <div class="tile"><span class="letter">B</span><span class="ref">Balance</span></div>

        <div class="folder" style="border-bottom-color:#4bc0f0;">
          <span class="letter">I</span>
          <span class="fmark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" stroke="#4bc0f0" stroke-width="2" stroke-linejoin="round"></path></svg></span>
          <span class="fname">Irregulares</span>
          <span class="fcount" style="font-size: 10px">12 coleções, 88 cartões</span>
        </div>

        <div class="tile"><span class="ref">Basic</span></div>
        <div class="tile"><span class="letter">C</span><span class="ref">Courage</span></div>

        <div class="folder" style="border-bottom-color:#c084fc;">
          <span class="letter">V</span>
          <span class="fmark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" stroke="#c084fc" stroke-width="2" stroke-linejoin="round"></path></svg></span>
          <span class="fname">Verbos</span>
          <span class="fcount" style="font-size: 10px">2 coleções</span>
        </div>

        <div class="tile"><span class="ref">Culture</span></div>
        <div class="tile"><span class="letter">D</span><span class="ref">Delight</span></div>

      </div></div>

    <div style="width:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:10px 0;">
      <div style="width:28px; height:28px; border-radius:9px; background:#ffc800; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#2b2317;">A</div>
      <span class="rail on">B</span>
      <span class="rail on">C</span>
      <span class="rail on">D</span>
      <span class="rail">E</span>
      <span class="rail">F</span>
      <span class="rail">G</span>
      <span class="rail">H</span>
      <span class="rail on">I</span>
      <span class="rail">J</span>
      <span class="rail">K</span>
      <span class="rail">L</span>
      <span class="rail">M</span>
      <span class="rail">N</span>
      <span class="rail">O</span>
      <span class="rail">P</span>
      <span class="rail">Q</span>
      <span class="rail">R</span>
      <span class="rail">S</span>
      <span class="rail">T</span>
      <span class="rail">U</span>
      <span class="rail on">V</span>
      <span class="rail">W</span>
      <span class="rail">X</span>
      <span class="rail">Y</span>
      <span class="rail">Z</span>
    </div>

  </div>

  <div style="display:flex; align-items:center; gap:12px; padding:12px 18px 26px 18px; border-top:2px solid #22303a; background:#131f24;">
    <button style="flex:1; height:56px; border:none; border-radius:16px; background:#ffc800; box-shadow:0 4px 0 #c99a00; color:#2b2317; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#2b2317"><path d="M7 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 7 5.5z"></path></svg>
      <span>PRATICAR</span>
    </button>
  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
    .label { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#7d929c; margin-bottom:8px; }
    /* 10 cores fixas: a escolhida ganha anel e marca */
    .sw { width:100%; aspect-ratio:1; border-radius:14px; border:none; cursor:pointer; }
    .swwrap { position:relative; }
    .swwrap.on::after { content:''; position:absolute; inset:-4px; border:2.5px solid #f1f7fb; border-radius:18px; }
  </style>
</helmet>

<div class="phone">

  <!-- A grade fica atrás, só escurecida pelo véu -->
  <div style="flex:1; display:flex; flex-direction:column; padding:34px 18px 0 18px; gap:13px;">
    <div style="height:44px; border-radius:16px; background:#1c2a31; border:2px solid #37464f;"></div>
    <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px;">
      <div style="height:104px; border:2px solid #ffc800; border-bottom-width:4px; border-radius:18px; background:#1f2c33;"></div>
      <div style="height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33;"></div>
      <div style="height:104px; border:2px solid #ffc800; border-bottom-width:4px; border-radius:18px; background:#1f2c33;"></div>
      <div style="height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33;"></div>
    </div>
  </div>

  <div style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(5,10,12,.66);"></div>

  <!-- Modal de criação -->
  <div style="position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; padding:0 22px;">
    <div style="width:100%; background:#1f2c33; border:2px solid #37464f; border-bottom-width:5px; border-radius:24px; padding:24px;">

      <h2 class="display" style="margin:0 0 4px 0; font-size:24px; font-weight:800; color:#f1f7fb;">Nova coleção</h2>
      

      <div class="label">Nome</div>
      <div style="border:2px solid #ffc800; border-radius:16px; padding:15px 16px; background:#1c2a31; display:flex; align-items:center; gap:4px; margin-bottom:22px;">
        <span style="font-size:17px; font-weight:700; color:#f1f7fb;">Substantivos</span>
        <div style="width:2px; height:22px; background:#ffc800;"></div>
      </div>

      <div class="label">Cor</div>
      <div style="display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; margin-bottom:24px;">
        <div class="swwrap"><button class="sw" style="background:#ffc800;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#ff9f45;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#ff6b6b;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#ff7eb6;"></button></div>
        <div class="swwrap on"><button class="sw" style="background:#c084fc;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#8b9dff;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#4bc0f0;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#3fd9c0;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#7ad13a;"></button></div>
        <div class="swwrap"><button class="sw" style="background:#c3e04a;"></button></div>
      </div>

      <button style="width:100%; height:56px; border:none; border-radius:16px; background:#ffc800; box-shadow:0 4px 0 #c99a00; color:#2b2317; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; cursor:pointer;">Criar coleção</button>

      <button style="width:100%; height:56px; margin-top:10px; border:none; border-radius:16px; background:transparent; color:#7d929c; font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; letter-spacing:.5px; cursor:pointer;">Cancelar</button>

    </div>
  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

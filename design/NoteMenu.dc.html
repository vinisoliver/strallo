<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
    .label { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#7d929c; }

    .note { display:flex; align-items:flex-start; gap:10px; background:#1c2a31; border:2px solid #2b3840; border-radius:14px; padding:11px 8px 11px 10px; }
    .notetext { flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.45; color:#dbe6ec; }
    .ref { color:#ffc800; font-weight:800; }
    .uline { color:#f1f7fb; border-bottom:2px solid #ffc800; }
    .grip { flex:none; line-height:0; padding-top:2px; }
    .dots { flex:none; line-height:0; padding-top:2px; }

    /* A nota que está sendo arrastada: sai do lugar, ganha sombra e a borda
       da marca, para o dedo saber o que está carregando. */
    .dragging { border-color:#ffc800; box-shadow:0 10px 22px rgba(0,0,0,.5); transform:translateY(-2px); }
    /* O buraco que ela deixou. */
    .slot { height:52px; border:2px dashed #37464f; border-radius:14px; background:rgba(28,42,49,.4); }

    .item { display:flex; align-items:center; gap:11px; padding:13px 15px; cursor:pointer; }
    .itemtext { font-size:15px; font-weight:800; }
  </style>
</helmet>

<div class="phone">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:34px 18px 12px 18px; border-bottom:2px solid #1b2830;">
    <button style="width:42px; height:42px; border-radius:12px; background:#1f2c33; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#7d929c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1 class="display" style="margin:0; font-size:20px; font-weight:800; color:#f1f7fb;">Editar cartão</h1>
    <div style="width:42px;"></div>
  </div>

  <div style="flex:1; padding:18px 18px 0 18px; position:relative;">

    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px;">
      <div class="label">Notas</div>
      <span style="font-size:12px; font-weight:700; color:#556670;">3 de 6</span>
    </div>

    <div style="display:flex; flex-direction:column; gap:9px;">

      <!-- Menu aberto nesta -->
      <div class="note" style="border-color:#37464f;">
        <span class="grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="#46565f"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg></span>
        <span class="notetext">It takes <span class="ref">courage</span> to admit you were wrong.</span>
        <span class="dots"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ffc800"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></span>
      </div>

      <div class="note">
        <span class="grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="#46565f"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg></span>
        <span class="notetext">She showed great <span class="ref">courage</span> <span class="uline">under pressure</span>.</span>
        <span class="dots"><svg width="18" height="18" viewBox="0 0 24 24" fill="#7d929c"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></span>
      </div>

      <div class="note">
        <span class="grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="#46565f"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg></span>
        <span class="notetext">Do vocábulo latino <span class="uline">cor</span>, que quer dizer coração.</span>
        <span class="dots"><svg width="18" height="18" viewBox="0 0 24 24" fill="#7d929c"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></span>
      </div>

    </div>

    <!-- Dropdown ancorado nos três pontos da primeira nota -->
    <div style="position:absolute; top:76px; right:20px; width:168px; background:#22323a; border:2px solid #37464f; border-bottom-width:4px; border-radius:16px; overflow:hidden; box-shadow:0 14px 30px rgba(0,0,0,.5);">
      <div class="item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" style="flex:none;"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5 4 20z" stroke="#f1f7fb" stroke-width="2" stroke-linejoin="round"></path></svg>
        <span class="itemtext" style="color:#f1f7fb;">Editar</span>
      </div>
      <div style="height:2px; background:#2b3840;"></div>
      <div class="item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" style="flex:none;"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span class="itemtext" style="color:#ff8f8f;">Excluir</span>
      </div>
    </div>

    <!-- Como fica ao arrastar, logo abaixo -->
    <div style="margin-top:34px;">
      <div class="label" style="color:#46565f; margin-bottom:9px;">Arrastando pela alça</div>

      <div style="display:flex; flex-direction:column; gap:9px;">
        <div class="slot"></div>

        <div class="note dragging">
          <span class="grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="#ffc800"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg></span>
          <span class="notetext">Do vocábulo latino <span class="uline">cor</span>, que quer dizer coração.</span>
          <span class="dots"><svg width="18" height="18" viewBox="0 0 24 24" fill="#7d929c"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></span>
        </div>

        <div class="note" style="opacity:.5;">
          <span class="grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="#46565f"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg></span>
          <span class="notetext">She showed great <span class="ref">courage</span> <span class="uline">under pressure</span>.</span>
          <span class="dots"><svg width="18" height="18" viewBox="0 0 24 24" fill="#7d929c"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></span>
        </div>
      </div>
    </div>

  </div>

  <div style="padding:12px 18px 26px 18px; display:flex; gap:12px; border-top:2px solid #22303a;">
    <button style="width:64px; height:56px; border-radius:16px; background:#1f2c33; border:2px solid #5a2b2b; border-bottom-width:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <button style="flex:1; height:56px; border:none; border-radius:16px; background:#ffc800; box-shadow:0 4px 0 #c99a00; color:#2b2317; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; cursor:pointer;">Salvar</button>
  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
    /* Números da conta, não do aparelho: é o que existe na nuvem. */
    .stat { flex:1; background:#1f2c33; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; padding:14px 10px 12px 10px; display:flex; flex-direction:column; align-items:center; gap:5px; }
    .statnum { font-family:'Baloo 2','Nunito',sans-serif; font-size:26px; font-weight:800; color:#f1f7fb; line-height:1; }
    .statlabel { font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:#7d929c; }
  </style>
</helmet>

<div class="phone">

  <div style="display:flex; align-items:center; gap:14px; padding:34px 18px 8px 18px;">
    <button style="width:34px; height:34px; border-radius:11px; background:#1f2c33; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#7d929c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <span class="display" style="font-size:20px; font-weight:800; color:#f1f7fb;">Conta</span>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; padding:0 18px 26px 18px;">

    <!-- Identidade: foto e nome vêm do Google, o e-mail confirma qual conta -->
    <div style="display: flex; align-items: center; gap: 16px; margin: 22px 0 20px 0">
      <div style="width:72px; height:72px; border-radius:26px; background:#c084fc; flex:none; display:flex; align-items:center; justify-content:center; overflow:hidden;">
        <span class="display" style="font-size:32px; font-weight:800; color:#241733;">V</span>
      </div>
      <div style="min-width:0;">
        <div class="display" style="font-size:23px; font-weight:800; color:#f1f7fb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Vinícius Oliveira</div>
        <div style="font-size:13px; font-weight:600; color:#7d929c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">vinisoliver20@gmail.com</div>
      </div>
    </div>

    <!-- Situação da sincronização: o mesmo verde do ícone no header -->
    <div style="display:flex; align-items:center; gap:13px; background:rgba(122,209,58,.14); border:2px solid #4a6b1f; border-radius:18px; padding:15px 16px; margin-bottom:22px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex:none;">
        <path d="M7 17.5h10.2a3.8 3.8 0 0 0 .4-7.58A5.5 5.5 0 0 0 7.2 8.7 4.4 4.4 0 0 0 7 17.5z" stroke="#7ad13a" stroke-width="1.9" stroke-linejoin="round"></path>
        <path d="M9.7 13.2l1.9 1.9 3.9-4" stroke="#7ad13a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="flex:1; min-width:0;">
        <div style="font-size:15px; font-weight:800; color:#9fe063;">Tudo sincronizado</div>
        <div style="font-size:12.5px; font-weight:600; color:#7d929c;">Última vez há 2 minutos</div>
      </div>
    </div>

    <div style="font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#7d929c; margin-bottom:10px;">SUAS ESTATÍSTICAS</div>

    <div style="display:flex; gap:11px; margin-bottom:12px;">

      <div class="stat">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="8.5" y="3.5" width="11" height="15" rx="2.5" stroke="#ffc800" stroke-width="2"></rect><rect x="4.5" y="6.5" width="11" height="15" rx="2.5" fill="#1f2c33" stroke="#ffc800" stroke-width="2"></rect></svg>
        <span class="statnum">124</span>
        <span class="statlabel">Cartões</span>
      </div>

      <div class="stat">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M3 7.5a2 2 0 0 1 2-2h3.6l1.9 2.2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5z" stroke="#c084fc" stroke-width="2" stroke-linejoin="round"></path></svg>
        <span class="statnum">12</span>
        <span class="statlabel">Coleções</span>
      </div>

      <div class="stat">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="#4bc0f0"><path d="M7 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 7 5.5z"></path></svg>
        <span class="statnum">38</span>
        <span class="statlabel">Práticas</span>
      </div>

    </div>

    <!-- Data de criação: uma linha só, porque não é um número que se compara -->
    <div style="display:flex; align-items:center; gap:10px; background:#1c2a31; border:2px solid #2b3840; border-radius:16px; padding:13px 15px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex:none;"><rect x="3.5" y="5.5" width="17" height="15" rx="3" stroke="#7d929c" stroke-width="2"></rect><path d="M3.5 10.5h17M8 3.5v4M16 3.5v4" stroke="#7d929c" stroke-width="2" stroke-linecap="round"></path></svg>
      <span style="font-size:14px; font-weight:700; color:#a8bcc7;">Na Strallo desde <span style="color: rgb(241, 247, 251); font-weight: 800">12 de março de 2026</span></span>
    </div>

    <div style="flex:1;"></div>

    <!-- Sair não apaga nada: os cartões continuam no aparelho -->
    <p style="margin:0 0 12px 0; font-size:12.5px; font-weight:600; color:#556670; text-align:center; line-height:1.45;">
      Sair não apaga os cartões deste aparelho.
    </p>

    <button style="width:100%; height:56px; border:2px solid #5a2b2b; border-radius:16px; background:rgba(255,107,107,.12); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"></path><path d="M17.5 8.5L21 12l-3.5 3.5M20.5 12H10" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; color:#ff8f8f; letter-spacing:.3px;">Sair da conta</span>
    </button>

  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

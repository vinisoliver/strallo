<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
  </style>
</helmet>

<div class="phone">

  <!-- A rodada segue ao fundo -->
  <div style="flex:1; display:flex; flex-direction:column;">

    <div style="display:flex; align-items:center; gap:12px; padding:34px 18px 8px 18px;">
      <div style="width:38px; height:38px; border-radius:11px; background:#1f2c33; flex:none;"></div>
      <div style="flex:1; height:16px; border-radius:10px; background:#243139; overflow:hidden;">
        <div style="width:52%; height:100%; border-radius:10px; background:#ffc800;"></div>
      </div>
    </div>

    <div style="display:flex; gap:12px; padding:12px 18px 0 18px;">
      <div style="flex:1; height:44px; background:rgba(75,192,240,.14); border-radius:14px;"></div>
      <div style="flex:1; height:44px; background:rgba(122,209,58,.14); border-radius:14px;"></div>
    </div>

    <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:0 24px;">
      <div style="width:100%; height:230px; border:2px solid #37464f; border-bottom-width:5px; border-radius:24px; background:#1f2c33; display:flex; align-items:center; justify-content:center;">
        <span class="display" style="font-size:46px; font-weight:800; color:#f1f7fb;">Courage</span>
      </div>
    </div>

    <div style="height:130px;"></div>
  </div>

  <!-- Véu -->
  <div style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(5,10,12,.66);"></div>

  <!-- Confirmação -->
  <div style="position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; padding:0 26px;">
    <div style="width:100%; background:#1f2c33; border:2px solid #37464f; border-bottom-width:5px; border-radius:24px; padding:24px;">

      <h2 class="display" style="margin:0; font-size:24px; font-weight:800; color:#f1f7fb; text-align:center;">Encerrar rodada?</h2>

      <p style="margin:10px 0 22px 0; font-size:15px; font-weight:600; color:#7d929c; text-align:center; line-height:1.45;">Se você sair agora, seu progresso nesta rodada será perdido.</p>

      <button style="width:100%; height:56px; border:none; border-radius:16px; background:#ff6b6b; box-shadow:0 4px 0 #b84545; color:#3a1010; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; cursor:pointer;">Sair da rodada</button>

      <button style="width:100%; height:56px; margin-top:10px; border:none; border-radius:16px; background:transparent; color:#7d929c; font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; letter-spacing:.5px; cursor:pointer;">Continuar jogando</button>

    </div>
  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

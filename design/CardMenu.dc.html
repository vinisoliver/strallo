<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
  </style>
</helmet>

<div class="phone">

  <!-- Dimmed background grid -->
  <div style="filter:blur(1px); opacity:.5; flex:1; display:flex; flex-direction:column;">
    <div style="padding:34px 18px 10px 18px;">
      <svg width="100" height="34" viewBox="20 12 232 80" style="margin-bottom:14px; fill:none; stroke:#ffc800; stroke-linecap:round; stroke-linejoin:round;">
        <path d="M58 40 C49 33 33 35 33 46 C33 55 52 53 55 63 C57 72 42 75 30 68" stroke-width="10"/>
        <path d="M70 24 C68 44 67 60 71 74 C73 80 79 79 83 75" stroke-width="10"/>
        <path d="M54 43 C63 41 77 41 86 44" stroke-width="8.5"/>
        <path d="M96 44 C95 55 95 64 97 74" stroke-width="10"/>
        <path d="M96 49 C100 43 108 42 114 47" stroke-width="9"/>
        <path d="M144 45 C143 55 143 64 146 74" stroke-width="10"/>
        <path d="M144 50 C136 45 124 49 124 58 C124 67 135 71 145 66" stroke-width="10"/>
        <path d="M156 24 C155 44 154 62 158 74 C160 80 166 79 170 75" stroke-width="10"/>
        <path d="M180 24 C179 44 178 62 182 74 C184 80 190 79 194 75" stroke-width="10"/>
        <path d="M213 44 C222 44 228 51 227 58 C226 66 219 71 211 70 C203 69 198 63 198 56 C199 49 205 44 213 44" stroke-width="10"/>
      </svg>
      <div style="background:#1c2a31; border:2px solid #37464f; border-radius:16px; padding:12px 14px; color:#7d929c; font-weight:700;">Buscar referência</div>
    </div>
    <div style="padding:6px 18px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px;">
      <div style="height:104px; border:2px dashed rgba(255,200,0,.5); border-radius:18px; background:rgba(255,200,0,.08);"></div>
      <div style="height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:#f1f7fb;">Abandon</div>
      <div style="height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:#f1f7fb;">Ability</div>
      <div style="height:104px; border-radius:18px; background:#1f2c33;"></div>
      <div style="height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:#f1f7fb;">Balance</div>
      <div style="height:104px; border:2px solid #37464f; border-bottom-width:4px; border-radius:18px; background:#1f2c33; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:#f1f7fb;">Basic</div>
    </div>
  </div>

  <!-- Overlay -->
  <div style="position:absolute; inset:0; background:rgba(5,10,12,.66);"></div>

  <!-- Focused card + selection menu -->
  <div style="position:absolute; top:250px; left:24px; width:180px;">
    <!-- Selected card (checkbox style) -->
    <div style="position:relative; height:120px; border:3px solid #ffc800; border-radius:18px; background:#1f2c33; box-shadow:0 12px 28px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;">
      <span style="position:absolute; top:10px; left:12px; font-size:11px; font-weight:800; color:#ffc800;">C</span>
      <!-- Checkbox -->
      <div style="position:absolute; top:9px; right:11px; width:24px; height:24px; border-radius:8px; background:#ffc800; display:flex; align-items:center; justify-content:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#2b2317" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-weight:800; font-size:21px; color:#f1f7fb;">Courage</span>
    </div>

    <!-- Dropdown -->
    <div style="margin-top:12px; background:#1f2c33; border:1px solid #37464f; border-radius:16px; box-shadow:0 12px 28px rgba(0,0,0,.5); overflow:hidden;">
      <div style="display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid #2b3840;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14.5 4.5l5 5L8 21H3v-5L14.5 4.5z" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 6l5 5" stroke="#ffffff" stroke-width="2.2"/></svg>
        <span style="font-weight:800; font-size:16px; color:#f1f7fb;">Editar</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:15px 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-weight:800; font-size:16px; color:#ff6b6b;">Excluir</span>
      </div>
    </div>
  </div>

  <!-- Hint -->
  <div style="position:absolute; bottom:40px; left:0; right:0; text-align:center; color:#c7d3d9; font-weight:700; font-size:14px; opacity:.85;">Segure um card por 2s para abrir</div>

</div>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
    .label { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#7d929c; margin-bottom:8px; }

    .ref { color:#ffc800; font-weight:800; }
    .uline { color:#f1f7fb; border-bottom:2px solid #ffc800; }
    /* Trecho selecionado agora: é sobre ele que o botão de sublinhar age. */
    .sel { background:rgba(255,200,0,.26); border-radius:3px; }
  </style>
</helmet>

<div class="phone">

  <!-- A tela de edição fica atrás, escurecida -->
  <div style="flex:1; display:flex; flex-direction:column; padding:34px 18px 0 18px; gap:14px;">
    <div style="height:42px; width:42px; border-radius:12px; background:#1f2c33;"></div>
    <div style="height:110px; border:2px solid #37464f; border-bottom-width:4px; border-radius:20px; background:#1f2c33;"></div>
    <div style="height:54px; border:2px solid #37464f; border-radius:16px; background:#1c2a31;"></div>
  </div>

  <div style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(5,10,12,.66);"></div>

  <!-- Modal da nota -->
  <div style="position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; padding:0 20px;">
    <div style="width:100%; background:#1f2c33; border:2px solid #37464f; border-bottom-width:5px; border-radius:24px; padding:24px 22px 22px 22px;">

      <h2 class="display" style="margin:0 0 18px 0; font-size:24px; font-weight:800; color:#f1f7fb;">Nova nota</h2>

      <div class="label">Texto</div>

      <!-- O campo mostra o resultado já formatado: a referência acesa, o
           trecho sublinhado, e a seleção corrente em destaque. -->
      <div style="border:2px solid #ffc800; border-radius:16px; background:#1c2a31; padding:14px 15px; min-height:104px; font-size:15.5px; font-weight:600; line-height:1.5; color:#dbe6ec;">
        She showed great <span class="ref">courage</span> <span class="sel">under pressure</span>, even when nobody was watching.<span style="display:inline-block; width:2px; height:19px; background:#ffc800; vertical-align:-3px; margin-left:1px;"></span>
      </div>

      <!-- Ferramenta e contagem na mesma linha: uma age sobre o texto, a
           outra diz quanto ainda cabe. -->
      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px; margin-bottom:18px;">
        <button style="display:flex; align-items:center; gap:8px; height:38px; padding:0 14px; border:2px solid #ffc800; border-radius:12px; background:rgba(255,200,0,.14); cursor:pointer;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M7 4v7a5 5 0 0 0 10 0V4" stroke="#ffc800" stroke-width="2.4" stroke-linecap="round"></path>
            <path d="M5.5 20h13" stroke="#ffc800" stroke-width="2.6" stroke-linecap="round"></path>
          </svg>
          <span style="font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; color:#ffc800;">Sublinhar</span>
        </button>

        <span style="font-size:13px; font-weight:800; color:#7d929c;">84<span style="color:#556670; font-weight:700;"> / 120</span></span>
      </div>

      <!-- Explica a única coisa que acontece sozinha -->
      <div style="display:flex; align-items:flex-start; gap:9px; background:#1c2a31; border-radius:12px; padding:11px 13px; margin-bottom:20px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex:none; margin-top:1px;"><path d="M12 3l2.2 5.6L20 9l-4.5 3.6L17 19l-5-3.2L7 19l1.5-6.4L4 9l5.8-.4L12 3z" stroke="#ffc800" stroke-width="1.8" stroke-linejoin="round"></path></svg>
        <span style="flex:1; font-size:12.5px; font-weight:600; line-height:1.45; color:#7d929c;">A referência do cartão ficará destacada.</span>
      </div>

      <button style="width:100%; height:56px; border:none; border-radius:16px; background:#ffc800; box-shadow:0 4px 0 #c99a00; color:#2b2317; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; cursor:pointer;">Adicionar</button>

      <button style="width:100%; height:52px; margin-top:8px; border:none; border-radius:16px; background:transparent; color:#7d929c; font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; letter-spacing:.5px; cursor:pointer;">Cancelar</button>

    </div>
  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>

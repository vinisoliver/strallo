<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; scrollbar-width:none; }
    *::-webkit-scrollbar { display:none; }
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; color:#f1f7fb; -webkit-font-smoothing:antialiased; }
    .phone { width:390px; height:844px; background:#131f24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .display { font-family:'Baloo 2','Nunito',system-ui,sans-serif; }
  </style>
</helmet>

<div class="phone">

  <!-- Fechar -->
  

  <!-- Título -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:34px 18px 12px 18px;">
    <button style="width:42px; height:42px; border-radius:12px; background:#1f2c33; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#7d929c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1 class="display" style="margin:0; font-size:20px; font-weight:800; color:#f1f7fb;">Praticar</h1>
    <div style="width:42px;"></div>
  </div><div style="padding:22px 18px 0 18px;">
    
  </div>

  <!-- O baralho e, logo abaixo, quantos cartões entram -->
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 64px; flex-grow: 1">

    <h1 class="display" style="margin:0; font-size:32px; font-weight:800; color:#f1f7fb; line-height:1;">Hora do desafio!</h1><div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; justify-content: center; align-items: center"><div style="position:relative; width:210px; height:144px;">
      <div style="position:absolute; left:21px; top:0; width:168px; height:118px; border-radius:22px; background:#1a262c; border:2px solid #2b3840; transform:rotate(-8deg);"></div>
      <div style="position:absolute; left:21px; top:7px; width:168px; height:118px; border-radius:22px; background:#1c2a31; border:2px solid #32424b; transform:rotate(5deg);"></div>
      <div style="position:absolute; left:21px; top:14px; width:168px; height:118px; border-radius:22px; background:#1f2c33; border:2px solid #37464f; border-bottom-width:4px; display:flex; align-items:center; justify-content:center;">
        <span class="display" style="font-size:28px; font-weight:800; color:#f1f7fb;">Courage</span>
      </div>
    </div><div style="font-size:16px; font-weight:700; color:#7d929c;">
      <span style="color:#ffc800; font-weight:800;">11</span> cartões prontos
    </div></div>

    

  </div>

  <!-- Escolha do modo: seleção, ainda sem nada escolhido -->
  <div style="padding:0 18px 30px 18px;">

    <div style="font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:#556670; margin-bottom:12px;">Escolha um modo</div>

    <div style="display:flex; gap:12px; margin-bottom:16px;">

      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; background:#1f2c33; border:2px solid #37464f; border-bottom-width:5px; border-radius:20px; padding:20px 12px 18px 12px; cursor:pointer;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="#4bc0f0" stroke-width="2.4"></circle><path d="M12 9v4l2.5 2M9 3h6" stroke="#4bc0f0" stroke-width="2.4" stroke-linecap="round"></path></svg>
        <div style="text-align:center;">
          <div class="display" style="font-size:18px; font-weight:800; color:#f1f7fb;">Por tempo</div>
          <div style="font-size:12.5px; font-weight:600; color:#7d929c; line-height:1.35; margin-top:3px;">Corra contra<br>o relógio</div>
        </div>
      </div>

      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; background:#1f2c33; border:2px solid #37464f; border-bottom-width:5px; border-radius:20px; padding:20px 12px 18px 12px; cursor:pointer;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="6.5" width="12" height="14" rx="2.6" stroke="#c084fc" stroke-width="2.1"></rect><path d="M8 3.5h10a2.5 2.5 0 0 1 2.5 2.5v11" stroke="#c084fc" stroke-width="2.1" stroke-linecap="round"></path></svg>
        <div style="text-align:center;">
          <div class="display" style="font-size:18px; font-weight:800; color:#f1f7fb;">Por quantidade</div>
          <div style="font-size:12.5px; font-weight:600; color:#7d929c; line-height:1.35; margin-top:3px;">Com número fixo<br>de cartões</div>
        </div>
      </div>

    </div>

    <!-- Desativado: só habilita depois de escolher um modo -->
    <button disabled="" style="width:100%; height:56px; border:none; border-radius:16px; background:#2a3840; color:#556670; font-family:'Nunito',sans-serif; font-weight:800; font-size:17px; letter-spacing:.8px; text-transform:uppercase; cursor:not-allowed;">PROSSEGUIR</button>

  </div>

</div>

<script data-dc-script="" data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</x-dc>
</body>
</html>
